<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silverback Orders</title>
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <div class="page-shell admin-shell">
        <div class="glass-card admin-card">
            <h2>Order Ledger</h2>
            <p>Total income: <strong>${{ total_income }}</strong></p>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Payment ID</th>
                        <th>Amount</th>
                        <th>Currency</th>
                        <th>Status</th>
                        <th>TX Hash</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody>
                    {% for order in orders %}
                    <tr>
                        <td>{{ order.payment_id }}</td>
                        <td>${{ order.amount }}</td>
                        <td>{{ order.currency }}</td>
                        <td>{{ order.status }}</td>
                        <td>{{ order.tx_hash or 'Pending' }}</td>
                        <td>{{ order.created_at }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            <a href="/logout" class="btn btn-secondary">Logout</a>
        </div>
    </div>
</body>
</html>
